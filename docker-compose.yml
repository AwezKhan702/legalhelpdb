services:
  postgres:
    image: postgres:16-alpine
    container_name: legalhelpdb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legalhelp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalhelp}
      POSTGRES_DB: ${POSTGRES_DB:-legalhelpdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/sql:ro
      - ./scripts/docker-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legalhelp} -d ${POSTGRES_DB:-legalhelpdb}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
